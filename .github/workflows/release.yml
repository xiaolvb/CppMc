name: build-and-release

on:
  push:
    branches: [main]
    paths:
      - "CppMc.py"
      - "cppmc/**"
      - "native/**"
      - "assets/**"
      - "tools/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build CppMc.exe and publish release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check pyinstaller pillow imageio-ffmpeg
          python --version
          python -m PyInstaller --version

      - name: Draw the icon
        run: python tools/make_icon.py assets

      - name: Compile C++ native helpers
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force cppmc/native | Out-Null
          $vcvars = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vcvars) {
            "## C++ compiler not found; the UI falls back to the pure-Python helpers" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          cmd /c "`"$vcvars`" && cl /O2 /LD /std:c++17 native\cppmc_native.cpp /Fe:cppmc\native\cppmc_native.dll"
          if (Test-Path cppmc/native/cppmc_native.dll) {
            Get-Item cppmc/native/cppmc_native.dll | Select-Object Name, Length | Out-String | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "## C++ build failed; the UI falls back to the pure-Python helpers" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Smoke test the launcher code
        run: python CppMc.py --list

      - name: Build single-file exe
        shell: pwsh
        run: |
          $pyiArgs = @(
            "--noconfirm", "--clean", "--onefile", "--noconsole", "--name", "CppMc",
            "--icon", "$env:GITHUB_WORKSPACE/assets/CppMc.ico",
            "--workpath", "build/ci", "--specpath", "build/ci", "--distpath", "dist"
          )
          if (Test-Path cppmc/native/cppmc_native.dll) {
            $pyiArgs += @("--add-binary", "cppmc/native/cppmc_native.dll;cppmc/native")
          }
          $pyiArgs += "$env:GITHUB_WORKSPACE/CppMc.py"
          python -m PyInstaller @pyiArgs *> build_log.txt
          $code = $LASTEXITCODE
          "### PyInstaller exit code: $code" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -LiteralPath build_log.txt -Tail 40 | Out-String | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { throw "PyInstaller failed with exit code $code" }

      - name: Verify the exe exists
        run: |
          if (!(Test-Path dist/CppMc.exe)) { throw "CppMc.exe was not produced" }
          Get-Item dist/CppMc.exe | Select-Object Name, Length

      - name: Cut the promo (GIF + MP4)
        shell: pwsh
        run: |
          python tools/make_promo_frames.py promo/frames
          python tools/build_promo.py
          $ff = (& python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
          "ffmpeg: $ff" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          & $ff -y -hide_banner -loglevel error -i promo/CppMc_promo.mp4 -vf "fps=8,scale=560:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=64[p];[b][p]paletteuse=dither=none" promo/CppMc_promo.gif
          if ($LASTEXITCODE -ne 0) { throw "gif render failed" }
          Get-Item promo/CppMc_promo.gif, promo/CppMc_promo.mp4 | Select-Object Name, Length | Out-String | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: C++mc v1.0.0
          fail_on_unmatched_files: true
          body: |
            ## C++mc v1.0.0

            纯 Python 写成的 Minecraft 启动器，打包为单文件 Windows exe，绿色运行、无需安装 Python。

            **这次更新：**
            - 找不到合适的 Java 时自动从 Adoptium 下载 Temurin（装到 `%APPDATA%\CppMc\java`，也可以自己填路径）
            - 支持微软正版账号登录（设备码流程），登录后自动填名字、离线模式依然可用
            - 界面动画由一小段 C++17 原生模块（ctypes）加速，DLL 缺失自动回退纯 Python
            - 宣传片 GIF / MP4 也放在这里了（README 里直接可看）

            **用法：**
            - 双击 `CppMc.exe` 打开深色界面：选版本 → 登录或填名字 → 启动游戏
            - 首次启动会把游戏文件下到 `%APPDATA%\CppMc\game`（SHA1 校验、并发下载、失败重试）
            - 命令行：`CppMc.exe --list`、`--install 26.3`、`--launch 26.3 --name Steve`、`--login`

            源码与说明：https://github.com/gunmigunm/CppMc

            游戏本体文件不随包分发，全部来自 Mojang 官方接口。
          files: |
            dist/CppMc.exe
            promo/CppMc_promo.gif
            promo/CppMc_promo.mp4
